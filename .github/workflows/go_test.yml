name: Go Test

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main
      - develop

jobs:
  go-test:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm --dir web/default install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir web/default build

      - name: Test
        run: go test -v ./...
