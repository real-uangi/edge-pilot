# Dataplaneapi managed File
# changing file directly can cause a conflict if dataplaneapi is running

global
  user root
  group root
  stats socket ipv4@0.0.0.0:19999 level admin expose-fd listeners
  log stdout format raw local0
  nosplice

defaults unnamed_defaults_1
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s

userlist dataplaneapi
  user admin insecure-password edge-pilot-internal

resolvers ep_dns
  hold nx 30s
  hold obsolete 30s
  hold other 30s
  hold refused 30s
  hold timeout 30s
  hold valid 10s
  timeout resolve 1s
  timeout retry 1s
  accepted_payload_size 8192
  parse-resolv-conf
  resolve_retries 3

frontend ep_http
  mode http
  bind 0.0.0.0:80 name public
  acl febae531_b091_43a7_9fff_2c4080eade2f_host hdr(host) -i snapshot.ratgg.com
  acl febae531_b091_43a7_9fff_2c4080eade2f_path path_beg /
  acl febae531_b091_43a7_9fff_2c4080eade2f_query_blue url_param(__ep_release_id) -i 045f88b1-ff1a-457e-86bd-f9ee668c3859
  acl febae531_b091_43a7_9fff_2c4080eade2f_query_green url_param(__ep_release_id) -i __edge_pilot_invalid__
  acl febae531_b091_43a7_9fff_2c4080eade2f_cookie_blue cook(ep_release_id_ghcr_io_real_uangi_icebreaker) -i 045f88b1-ff1a-457e-86bd-f9ee668c3859
  acl febae531_b091_43a7_9fff_2c4080eade2f_cookie_green cook(ep_release_id_ghcr_io_real_uangi_icebreaker) -i __edge_pilot_invalid__
  use_backend febae531-b091-43a7-9fff-2c4080eade2f_blue if febae531_b091_43a7_9fff_2c4080eade2f_host febae531_b091_43a7_9fff_2c4080eade2f_path febae531_b091_43a7_9fff_2c4080eade2f_query_blue
  use_backend febae531-b091-43a7-9fff-2c4080eade2f_green if febae531_b091_43a7_9fff_2c4080eade2f_host febae531_b091_43a7_9fff_2c4080eade2f_path febae531_b091_43a7_9fff_2c4080eade2f_query_green
  use_backend febae531-b091-43a7-9fff-2c4080eade2f_blue if febae531_b091_43a7_9fff_2c4080eade2f_host febae531_b091_43a7_9fff_2c4080eade2f_path !febae531_b091_43a7_9fff_2c4080eade2f_query_blue !febae531_b091_43a7_9fff_2c4080eade2f_query_green febae531_b091_43a7_9fff_2c4080eade2f_cookie_blue
  use_backend febae531-b091-43a7-9fff-2c4080eade2f_green if febae531_b091_43a7_9fff_2c4080eade2f_host febae531_b091_43a7_9fff_2c4080eade2f_path !febae531_b091_43a7_9fff_2c4080eade2f_query_blue !febae531_b091_43a7_9fff_2c4080eade2f_query_green febae531_b091_43a7_9fff_2c4080eade2f_cookie_green
  use_backend febae531-b091-43a7-9fff-2c4080eade2f_blue if febae531_b091_43a7_9fff_2c4080eade2f_host febae531_b091_43a7_9fff_2c4080eade2f_path !febae531_b091_43a7_9fff_2c4080eade2f_query_blue !febae531_b091_43a7_9fff_2c4080eade2f_query_green !febae531_b091_43a7_9fff_2c4080eade2f_cookie_blue !febae531_b091_43a7_9fff_2c4080eade2f_cookie_green
  default_backend ep_default
  http-after-response add-header Set-Cookie
  http-after-response set-header X-Edge-Pilot-Current-Release-Id
  http-after-response set-header X-Edge-Pilot-Live-Release-Id

backend ep_default from unnamed_defaults_1
  mode http
  http-request return status 503 content-type text/plain string no-route

backend febae531-b091-43a7-9fff-2c4080eade2f_blue
  mode http
  balance roundrobin
  server blue ep-ghcr.io-real-uangi-icebreaker-blue:7777 check resolvers ep_dns

backend febae531-b091-43a7-9fff-2c4080eade2f_green
  mode http
  balance roundrobin
  server green ep-ghcr.io-real-uangi-icebreaker-green:7777 check resolvers ep_dns
